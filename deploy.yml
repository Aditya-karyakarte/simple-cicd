- name: Deploy simple-cicd
  hosts: localhost
  connection: local
  vars:
    version: "1"
    health_host: "localhost"
    port: "8082"
    container: "simple-cicd-app"
  tasks:
    - name: Remove old container if present
      command: docker rm -f {{ container }}
      failed_when: false
      changed_when: false

    - name: Start new container
      command: docker run -d --name {{ container }} -p {{ port }}:80 simple-cicd:{{ version }}

    - name: Health check
      uri:
        url: http://{{ health_host }}:{{ port }}
        status_code: 200
      register: result
      until: result.status == 200
      retries: 5
      delay: 2
